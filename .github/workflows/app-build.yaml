name: App Build

on:
  push:
    branches:
      - Zidoo-Edition
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # tag=v4.2.2
      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # tag=v4.7.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;33.0.1" "ndk;26.1.10909125"
      - name: Assemble debug APKs
        run: ./gradlew --build-cache --no-daemon --info :app:assembleDebug
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # tag=v4.6.2
        with:
          name: build-artifacts
          retention-days: 14
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk
