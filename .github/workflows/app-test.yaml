name: App Test

on:
  push:
    branches:
      - Zidoo-Edition
      - release-*
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # tag=v4.2.2
      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # tag=v4.7.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;33.0.1" "ndk;26.1.10909125"
      - name: Run test task
        run: ./gradlew --build-cache --no-daemon --info test
